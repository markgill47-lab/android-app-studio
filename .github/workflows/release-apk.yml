name: Build signed APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore lives only in repository secrets. It is written to a file
      # outside the workspace and deleted when the runner is torn down. With no
      # secret set, this step does nothing and the build falls back to the
      # debug key, so the pipeline stays testable.
      - name: Restore the signing keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No RELEASE_KEYSTORE_BASE64 secret. Falling back to the debug key."
          fi

      - name: Build the release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APKs
        id: collect
        run: |
          mkdir -p dist
          find apps -path '*/build/outputs/apk/release/*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              module=$(printf '%s' "$apk" | cut -d/ -f2)
              cp "$apk" "dist/$module.apk"
            done
          ls -l dist
          echo "count=$(ls -1 dist | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload the APKs as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error

      # The release is the thing you open on your phone. Every push to main
      # makes a new one, tagged with the run number, with each app's APK
      # attached.
      - name: Publish a release with the APKs attached
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          tag="build-${{ github.run_number }}"
          if [ "$SIGNED" = "true" ]; then
            note="Signed with the release key. Install this one on your phone."
          else
            note="Debug-signed. Add the signing secrets to get a release-signed APK."
          fi
          gh release create "$tag" dist/*.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "$note"$'\n\n'"Commit ${{ github.sha }}"
